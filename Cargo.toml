[workspace]
resolver = "2"
members = [
    "crates/zouwu-app",
    "crates/zouwu-core",
    "crates/zouwu-platform",
    "crates/zouwu-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/zouwu"

[workspace.dependencies]
zouwu-core = { path = "crates/zouwu-core" }
zouwu-platform = { path = "crates/zouwu-platform" }
zouwu-ui = { path = "crates/zouwu-ui" }

bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
tiny-skia = "0.12"
toml = "0.9"
wgpu = "30.0"
winit = "0.30"
tray-icon = "0.26"
global-hotkey = "0.9"
fluent = "0.17"
sys-locale = "0.3"
unic-langid = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3