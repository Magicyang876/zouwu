[workspace]
resolver = "2"
members = [
    "crates/zouwu-app",
    "crates/zouwu-core",
    "crates/zouwu-platform",
    "crates/zouwu-ui",
    "crates/iconres",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/zouwu"

[workspace.dependencies]
zouwu-core = { path = "crates/zouwu-core" }
zouwu-platform = { path = "crates/zouwu-platform" }
zouwu-ui = { path = "crates/zouwu-ui" }

bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
tiny-skia = "0.12"
toml = "0.9"
wgpu = "30.0"
rqrr = "0.11"
winit = "0.30"
raw-window-handle = "0.6"
tray-icon = "0.26"
global-hotkey = "0.9"
fluent = "0.17"
sys-locale = "0.3"
unic-langid = "0.9"
# 设置面板需要第二个"真窗口"（要焦点、要键盘），分层窗口做不到；
# softbuffer 是最小的一块：DIB + BitBlt，不引入 GPU 依赖。
softbuffer = "0.4"
# 文本栅格化（系统字体，见 crates/zouwu-ui/src/text.rs）

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# 发布版：剥符号 + thin LTO。
# 实测 10.6 MB → 6.9 MB（单条 `strip` 只到 7.9 MB，LTO 再省掉一层泛型重复实例化）。
# 不设 `panic = "abort"`：winit 的事件循环里一旦 panic 直接 abort 会留下看不见的窗口。
[profile.release]
strip = "symbols"
lto = "thin"
