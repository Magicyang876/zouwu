# 水墨驺吾 —— 官方第二套皮肤
id = "zouwu-ink"
name = "水墨驺吾"
author = "zouwu"
version = "1.0.0"
theme = "zouwu-dark"

[geometry]
radius = 56.0
breath_amount = 0.03

# 墨团在 256 画布里只占 0.6（留了水墨的空白），所以图层要放大 1/0.6 ≈ 1.67 倍，
# 才让 `radius` 继续表示"桌面上的墨团半径"。这个数由 make_skins.rs 按实测占比
# 反推、不手调——手调会让 `radius` 的口径悄悄漂移，环菜单就会贴上身体。
[[layers]]
image = "body.png"
scale = 1.67

[[layers]]
image = "blink.png"
role = "blink"
scale = 1.67

[[layers]]
image = "seal.png"
role = "overlay"
scale = 1.67
